<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f5;--panel:#fff;--ink:#101828;--mute:#667085;--line:#d9dee7;--accent:#3b3fc4}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Instrument Sans",system-ui,sans-serif}
h1,h2,.brand{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:22px 20px 80px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:56px}
.brand{font-weight:700;font-size:19px;letter-spacing:-.01em}
header span{color:var(--mute);font-size:14px}
h1{font-weight:700;font-size:clamp(32px,5.4vw,56px);line-height:1.04;letter-spacing:-.025em;max-width:17em}
.sub{font-size:18px;color:var(--mute);margin:14px 0 34px}
.pipe{display:flex;height:60px;border-radius:12px;overflow:hidden;gap:3px}
.seg{flex:0 1 0;min-width:0;display:flex;align-items:center;padding-left:14px;background:var(--c);color:var(--t);font:700 20px "Bricolage Grotesque",sans-serif;overflow:hidden;transition:flex-grow .9s cubic-bezier(.2,.7,.2,1)}
.seg.empty{flex:1;background:var(--line);color:var(--mute);font:500 15px "Instrument Sans",sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:8px 26px;margin:14px 0 64px;font-size:14px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.legend b{color:var(--ink);margin-left:3px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:56px;margin-bottom:64px}
h2{font-weight:600;font-size:20px;letter-spacing:-.01em;margin-bottom:18px}
.r{margin-bottom:20px}
.r .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.r b{font:700 22px "Bricolage Grotesque",sans-serif}
small{color:var(--mute);font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--line);margin-bottom:5px}
.bar u{display:block;height:100%;border-radius:99px;background:var(--accent);text-decoration:none}
.wk{display:flex;align-items:flex-end;gap:7px;height:150px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:12px;color:var(--mute)}
.wk b{width:100%;background:var(--accent);border-radius:5px 5px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
#add{display:grid;grid-template-columns:1.2fr 1.2fr .8fr auto;gap:10px;margin:0 0 20px}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 11px;min-width:0}
button{cursor:pointer;border:0;border-radius:7px;padding:9px 16px;background:var(--accent);color:#fff;font-weight:600}
button.ghost,button.link{background:none;color:var(--mute);padding:4px 8px;font-weight:500}
button.link{text-decoration:underline;padding:10px 0 0}
:focus-visible{outline:3px solid #8e92ff;outline-offset:2px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-weight:500;color:var(--mute);font-size:13px}
td,th{padding:11px 8px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td select{border-left:7px solid var(--c);font-weight:500}
.mute{color:var(--mute)}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth form{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px;width:100%;max-width:380px;display:grid;gap:14px}
.auth h1{font-size:32px}
.auth label{display:grid;gap:6px;font-weight:500;font-size:14px}
.err{color:#b42318;margin:0;min-height:1.4em;font-size:14px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;font-size:14px}
@media(max-width:820px){.two{grid-template-columns:1fr;gap:44px}#add{grid-template-columns:1fr 1fr}header{margin-bottom:36px}}
@media(prefers-reduced-motion:reduce){.seg{transition:none}}

body{background:radial-gradient(900px 500px at 6% -5%,#ffd0e6 0,transparent 60%),radial-gradient(800px 520px at 100% 0,#d3c6ff 0,transparent 55%),radial-gradient(760px 520px at 50% 105%,#bff5e4 0,transparent 60%),#fff6fb;background-attachment:fixed}
header{margin-bottom:22px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:38px 42px;border-radius:30px;color:#fff;margin-bottom:26px;background:linear-gradient(120deg,#7c3aed 0%,#ec4899 55%,#ff8a3d 100%);box-shadow:0 24px 50px -20px rgba(124,58,237,.6);overflow:hidden}
.hero h1{color:#fff;font-size:clamp(30px,4.6vw,50px)}
.hero .sub{color:rgba(255,255,255,.92);margin:12px 0 0;font-size:19px}
.hero svg{flex:0 0 min(300px,36%);height:auto}
.pipe{height:74px;border-radius:22px;padding:7px;background:#fff;box-shadow:0 12px 30px -16px rgba(124,58,237,.5)}
.seg{border-radius:15px;font-size:22px;justify-content:center;padding:0}
.legend{margin:16px 0 38px;font-size:15px;color:var(--ink);gap:10px}
.legend span{background:#fff;border-radius:99px;padding:6px 15px 6px 11px;box-shadow:0 6px 16px -10px rgba(16,24,40,.45)}
.legend i{width:12px;height:12px}
.two{gap:22px;margin-bottom:26px}
.two section{background:#fff;border-radius:26px;padding:26px;box-shadow:0 16px 36px -22px rgba(124,58,237,.6)}
.bar{height:12px;background:#f1eaff}
.bar u{background:linear-gradient(90deg,var(--g1),var(--g2))}
.wk b{background:linear-gradient(180deg,#ff8a3d,#ec4899 45%,#7c3aed);border-radius:8px 8px 0 0}
.panel{border:0;border-radius:26px;box-shadow:0 16px 36px -22px rgba(236,72,153,.6)}
button{background:linear-gradient(120deg,#7c3aed,#ec4899);border-radius:99px;padding:10px 20px}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff;font:700 15px "Bricolage Grotesque",sans-serif;margin-right:10px;vertical-align:middle}
.auth{background:linear-gradient(135deg,#7c3aed,#ec4899 60%,#ff8a3d)}
.auth form{border:0;border-radius:26px;box-shadow:0 24px 50px -20px rgba(0,0,0,.4)}
@media(max-width:820px){.hero{padding:26px}.hero svg{display:none}}
</style>
</head>
<body>
<section id="auth" class="auth" hidden>
  <form id="authForm">
    <div class="brand">Job tracker</div>
    <h1 id="authTitle">Welcome back</h1>
    <label>Email<input id="email" type="email" required autocomplete="username"></label>
    <label>Password<input id="pw" type="password" minlength="8" required autocomplete="current-password"></label>
    <p id="authErr" class="err" role="alert"></p>
    <button id="authBtn">Log in</button>
    <button type="button" class="link" id="swap"></button>
  </form>
</section>

<main id="app" class="wrap" hidden>
  <header>
    <div class="brand">Job tracker</div>
    <span><span id="who"></span> <button class="ghost" id="out">Log out</button></span>
  </header>
  <section class="hero"><div><h1 id="headline"></h1><p class="sub" id="subline"></p></div>
    <svg viewBox="0 0 300 240" aria-hidden="true">
      <circle cx="236" cy="52" r="30" fill="#ffd23f"/>
      <ellipse cx="236" cy="52" rx="50" ry="10" fill="none" stroke="#fff" stroke-width="4" transform="rotate(-18 236 52)"/>
      <circle cx="52" cy="168" r="16" fill="#19d3a2"/><circle cx="40" cy="40" r="6" fill="#fff"/>
      <circle cx="274" cy="150" r="5" fill="#fff"/><circle cx="110" cy="30" r="4" fill="#fff"/>
      <g transform="rotate(35 150 130)">
        <path d="M150 40c26 24 34 62 28 104h-56c-6-42 2-80 28-104z" fill="#fff"/>
        <circle cx="150" cy="96" r="14" fill="#38bdf8" stroke="#7c3aed" stroke-width="5"/>
        <path d="M122 144l-24 30 30-6zM178 144l24 30-30-6z" fill="#ff4d8d"/>
        <path d="M134 150h32l-16 52z" fill="#ffd23f"/>
      </g>
    </svg></section>
  <div class="pipe" id="pipe" role="img" aria-label="Applications by stage"></div>
  <div class="legend" id="legend"></div>

  <div class="two">
    <section><h2>Which sources reply</h2><div id="src"></div></section>
    <section><h2>Applications per week</h2><div class="wk" id="wk"></div></section>
  </div>

  <section class="panel">
    <h2>Your applications</h2>
    <form id="add">
      <input name="company" placeholder="Company" required maxlength="120" aria-label="Company">
      <input name="role" placeholder="Role" required maxlength="120" aria-label="Role">
      <select name="source" aria-label="Source"><option>linkedin</option><option>referral</option><option>portal</option><option>other</option></select>
      <button>Add application</button>
    </form>
    <div class="scroll">
      <table>
        <thead><tr><th>Company</th><th>Role</th><th>Source</th><th>Applied</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>
<div id="toast" role="status" hidden></div>

<script>
const $ = s => document.querySelector(s);
const ST = ["applied", "oa", "interview", "offer", "rejected"];
const NAME = {applied: "Applied", oa: "Online test", interview: "Interview", offer: "Offer", rejected: "Rejected"};
const COL = {applied: ["#38bdf8", "#fff"], oa: ["#ffc933", "#101828"], interview: ["#8b5cf6", "#fff"], offer: ["#10d9a0", "#073b2e"], rejected: ["#ff5d7a", "#fff"]};
const EMO = {applied: "📨", oa: "📝", interview: "🎤", offer: "🎉", rejected: "🌧️"};
const PAL = [["#7c3aed", "#ec4899"], ["#0ea5e9", "#10d9a0"], ["#ff8a3d", "#ffd23f"], ["#ec4899", "#ff8a3d"]];
let token = sessionStorage.getItem("t"), mode = "login";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const J = (method, body) => ({method, headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
const fmt = d => new Date(d + "T00:00").toLocaleDateString("en-IN", {day: "numeric", month: "short"});

async function api(path, opt = {}) {
  const headers = {...(opt.headers || {})};
  if (token) headers.Authorization = "Bearer " + token;
  const r = await fetch(path, {...opt, headers});
  if (r.status === 401 && token) { logout(); throw new Error("Session expired. Log in again."); }
  if (!r.ok) {
    let m = "Something went wrong.";
    try { const j = await r.json(); m = typeof j.detail === "string" ? j.detail : "Check the email and use a password of 8 or more characters."; } catch {}
    throw new Error(m);
  }
  return r.status === 204 ? null : r.json();
}

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.id); toast.id = setTimeout(() => t.hidden = true, 3500);
}

function setMode(m) {
  mode = m;
  $("#authTitle").textContent = m === "login" ? "Welcome back" : "Create your account";
  $("#authBtn").textContent = m === "login" ? "Log in" : "Sign up";
  $("#swap").textContent = m === "login" ? "New here? Create an account" : "Have an account? Log in";
  $("#authErr").textContent = "";
}

$("#authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("#email").value.trim(), password = $("#pw").value;
  try {
    if (mode === "register") await api("/auth/register", J("POST", {email, password}));
    const t = await api("/auth/login", {method: "POST", body: new URLSearchParams({username: email, password})});
    token = t.access_token; sessionStorage.setItem("t", token);
    show();
  } catch (err) { $("#authErr").textContent = err.message; }
});
$("#swap").addEventListener("click", () => setMode(mode === "login" ? "register" : "login"));
$("#out").addEventListener("click", logout);

function logout() { token = null; sessionStorage.removeItem("t"); show(); }

async function show() {
  $("#auth").hidden = !!token; $("#app").hidden = !token;
  if (!token) return;
  try { $("#who").textContent = (await api("/auth/me")).email; await load(); } catch (err) { toast(err.message); }
}

async function load() {
  const [s, src, wk, apps] = await Promise.all([
    api("/analytics/summary"), api("/analytics/by-source"), api("/analytics/weekly"), api("/applications?limit=200")
  ]);
  head(s); pipe(s); sources(src); weekly(wk); table(apps);
}

function head(s) {
  const t = s.total, replied = t - s.by_status.applied;
  $("#headline").textContent = t ? `You've sent ${t} application${t === 1 ? "" : "s"}. ${replied} got a reply.` : "Nothing tracked yet.";
  $("#subline").textContent = t ? `${s.interview_rate_pct}% reached an interview or offer.` : "Add your first application below.";
}

function pipe(s) {
  const el = $("#pipe");
  el.innerHTML = ST.filter(k => s.by_status[k]).map(k =>
    `<div class="seg" style="--c:${COL[k][0]};--t:${COL[k][1]}" data-n="${s.by_status[k]}" title="${NAME[k]}">${s.by_status[k]}</div>`
  ).join("") || `<div class="seg empty">No data yet</div>`;
  requestAnimationFrame(() => requestAnimationFrame(() =>
    el.querySelectorAll(".seg[data-n]").forEach(e => e.style.flexGrow = e.dataset.n)));
  $("#legend").innerHTML = ST.map(k =>
    `<span><i style="background:${COL[k][0]}"></i>${EMO[k]} ${NAME[k]}<b>${s.by_status[k]}</b></span>`).join("");
}

function sources(a) {
  $("#src").innerHTML = a.length ? a.map((x, i) =>
    `<div class="r"><div class="t"><span>${esc(x.source)} <small>${x.total} sent</small></span><b>${x.response_rate_pct}%</b></div>
     <div class="bar"><u style="width:${x.response_rate_pct}%;--g1:${PAL[i % 4][0]};--g2:${PAL[i % 4][1]}"></u></div>
     <small>${x.interview_rate_pct}% reached an interview</small></div>`).join("")
    : `<p class="mute">Reply rates by source show up after your first application.</p>`;
}

function weekly(a) {
  a = a.slice(-10);
  const m = Math.max(1, ...a.map(x => x.applications));
  $("#wk").innerHTML = a.length ? a.map(x =>
    `<div><span>${x.applications}</span><b style="height:${Math.round(x.applications / m * 90) + 4}px"></b><small>${fmt(x.week_start)}</small></div>`).join("")
    : `<p class="mute">Nothing logged yet.</p>`;
}

function table(a) {
  $("#rows").innerHTML = a.length ? a.map(x =>
    `<tr><td><span class="av" style="background:linear-gradient(135deg,${PAL[x.id % 4][0]},${PAL[x.id % 4][1]})">${esc(x.company[0].toUpperCase())}</span><b>${esc(x.company)}</b></td><td>${esc(x.role)}</td><td>${esc(x.source)}</td><td>${fmt(x.applied_on)}</td>
     <td><select data-id="${x.id}" style="--c:${COL[x.status][0]}" aria-label="Status for ${esc(x.company)}">${ST.map(k => `<option value="${k}"${k === x.status ? " selected" : ""}>${NAME[k]}</option>`).join("")}</select></td>
     <td><button class="ghost" data-del="${x.id}" aria-label="Delete ${esc(x.company)}">Delete</button></td></tr>`).join("")
    : `<tr><td colspan="6" class="mute">No applications yet. Add one above.</td></tr>`;
}

async function act(fn) {
  try { await fn(); await load(); return true; } catch (err) { toast(err.message); return false; }
}
$("#rows").addEventListener("change", e => {
  const id = e.target.dataset.id;
  if (id) act(() => api("/applications/" + id, J("PATCH", {status: e.target.value})));
});
$("#rows").addEventListener("click", e => {
  const id = e.target.dataset.del;
  if (id && confirm("Delete this application?")) act(() => api("/applications/" + id, {method: "DELETE"}));
});
$("#add").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  const ok = await act(() => api("/applications", J("POST", {company: f.company.value.trim(), role: f.role.value.trim(), source: f.source.value})));
  if (ok) f.reset();
});

setMode("login");
show();
</script>
</body>
</html>
